{% if request.user.is_authenticated %}
    <div class="dropdown">
        <button class="btn btn-light border rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-3 py-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-5 text-primary"></i>
            <span class="fw-semibold text-dark">{{ request.user.username }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2">
            <li>
                <a class="dropdown-item py-2" href="{% url 'accounts:profile' %}">
                    <i class="bi bi-person me-2 text-primary"></i> Shaxsiy Kabinet
                </a>
            </li>
            <li>
                <a class="dropdown-item py-2" href="{% url 'accounts:profile_edit' %}">
                    <i class="bi bi-gear me-2 text-secondary"></i> Sozlamalar
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item py-2 text-danger" href="{% url 'accounts:logout' %}">
                    <i class="bi bi-box-arrow-right me-2"></i> Chiqish
                </a>
            </li>
        </ul>
    </div>
{% endif %}
