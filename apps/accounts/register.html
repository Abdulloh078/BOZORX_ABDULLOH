{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Ro'yxatdan o'tish</h3>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Ro'yxatdan o'tish</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <small>Akkauntingiz bormi? <a href="{% url 'accounts:login' %}">Kirish</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
